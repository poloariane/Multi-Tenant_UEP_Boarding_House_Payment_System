<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — UEP BH Payment System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="topbar">

        <i id="hamburger" class="fas fa-bars"></i>

        <a href="about.html" class="title-link">
            <div class="title">
                <img src="assets/photos/logo.png" alt="UEP Logo">
                Multi-Tenant Boarding House Payment System
            </div>
        </a>

        <div class="topbar-buttons">
            <a href="profile.html" class="admin-btn">Admin</a>
            <a href="logout.html" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="layout">

        <div class="nav" id="sidebar">
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="tenant-list.html"><i class="fas fa-user-friends"></i> Tenants</a>
            <a href="pay-rent.html"><i class="fas fa-money-bill-wave"></i> Pay Rent</a>
            <a href="payment-records.html"><i class="fas fa-receipt"></i> Payment Records</a>
            <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
            <a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a>
            <a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a>
            <a href="calendar.html"><i class="fas fa-calendar"></i> Calendar</a>
        </div>

        <div class="main">
            <div class="section-title"><i class="fas fa-gear"></i> Settings</div>

            <div class="settings-grid">

                <!-- ── Account Settings ── -->
                <div class="settings-card">
                    <div class="settings-card-head">
                        <i class="fas fa-user-cog"></i>
                        <h3>Account Settings</h3>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label>Change Password</label>
                        <input type="password" id="password" placeholder="Enter new password">
                    </div>
                </div>

                <!-- ── Preferences ── -->
                <div class="settings-card">
                    <div class="settings-card-head">
                        <i class="fas fa-sliders-h"></i>
                        <h3>Preferences</h3>
                    </div>
                    <div class="form-group">
                        <label class="toggle-label">
                            <span>Dark Mode</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="darkmode">
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="toggle-label">
                            <span>Email Notifications</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="emailnotif">
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                    </div>
                    <div class="form-group">
                        <label>Language</label>
                        <select id="language"><option>English</option></select>
                    </div>
                </div>

                <!-- ── Payment Settings ── -->
                <div class="settings-card" id="payment-settings">
                    <div class="settings-card-head">
                        <i class="fas fa-money-bill-wave"></i>
                        <h3>Payment Settings</h3>
                    </div>
                    <div class="form-group">
                        <label>Default Monthly Rent (₱)</label>
                        <input type="number" id="rent">
                    </div>
                    <div class="form-group">
                        <label>Grace Period (Days)</label>
                        <input type="number" id="grace">
                    </div>
                    <div class="form-group">
                        <label>Late Fee (₱)</label>
                        <input type="number" id="latefee">
                    </div>
                </div>

                <!-- ── Tenant Management ── -->
                <div class="settings-card" id="tenant-management">
                    <div class="settings-card-head">
                        <i class="fas fa-users"></i>
                        <h3>Tenant Management</h3>
                    </div>
                    <div class="form-group">
                        <label class="toggle-label">
                            <span>Auto-generate Tenant ID</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="autoid">
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="toggle-label">
                            <span>Allow Partial Payments</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="partial">
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                    </div>
                    <div class="form-group">
                        <label>Send Reminder Before Due (Days)</label>
                        <input type="number" id="reminder">
                    </div>
                </div>

                <!-- ── Security Settings ── -->
                <div class="settings-card" id="security-settings">
                    <div class="settings-card-head">
                        <i class="fas fa-shield-alt"></i>
                        <h3>Security Settings</h3>
                    </div>
                    <div class="form-group">
                        <label class="toggle-label">
                            <span>Require Password Every Login</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="requirepass">
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                    </div>
                    <div class="form-group">
                        <label>Auto Logout Timeout (Minutes)</label>
                        <input type="number" id="autologout">
                    </div>
                </div>

                <!-- ── Boarding House Details ── (admin only) ── -->
                <div class="settings-card" id="boarding-house-details">
                    <div class="settings-card-head">
                        <i class="fas fa-home"></i>
                        <h3>Boarding House Details</h3>
                    </div>
                    <div class="form-group">
                        <label>Boarding House Name</label>
                        <input type="text" id="bhname">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address">
                    </div>
                    <div class="form-group">
                        <label>Owner Contact Number</label>
                        <input type="text" id="ownercontact">
                    </div>
                </div>

            </div>

            <button class="primary-btn save-btn" id="saveBtn">
                <i class="fas fa-save"></i> Save Settings
            </button>

        </div>
    </div>

    <script>
        // ── Authenticated-user fields ────────────────────────────────────
        const role      = localStorage.getItem("role") || "tenant";
        const activeUser = role === "admin"
            ? JSON.parse(localStorage.getItem("activeAdmin") || "null")
            : JSON.parse(localStorage.getItem("activeTenant") || "null");

        // Auto-fill Account Settings from logged-in user
        if (activeUser) {
            const userEl = document.getElementById("username");
            const emailEl = document.getElementById("email");
            const passEl = document.getElementById("password");
            if (userEl)  userEl.value  = activeUser.name  || "";
            if (emailEl) emailEl.value = activeUser.email || "";
            if (passEl)  passEl.value  = activeUser.password || "";
        }

        // ── Dark mode ───────────────────────────────────────────────────
        const darkEl     = document.getElementById("darkmode");
        const savedDark  = localStorage.getItem("darkmode");
        if (savedDark !== null) {
            darkEl.checked = savedDark === "true";
        }
        if (darkEl.checked) document.body.classList.add("dark-mode");

        darkEl.addEventListener("change", () => {
            document.body.classList.toggle("dark-mode", darkEl.checked);
            localStorage.setItem("darkmode", darkEl.checked);
        });

        // ── Email notifications (boolean — no persistence key beyond saved) ──
        const notifEl    = document.getElementById("emailnotif");
        const savedNotif = localStorage.getItem("emailnotif");
        if (savedNotif !== null) {
            notifEl.checked = savedNotif === "true";
        }

        notifEl.addEventListener("change", () => {
            localStorage.setItem("emailnotif", notifEl.checked);
        });

        // ── Save button — persist all remaining fields ───────────────────
        document.getElementById("saveBtn").addEventListener("click", function() {
            const fields = ["username","email","password","darkmode","emailnotif","language",
                            "rent","grace","latefee","autoid","partial","reminder",
                            "requirepass","autologout","bhname","address","ownercontact"];
            fields.forEach(f => {
                const element = document.getElementById(f);
                if(!element) return;
                if(element.type === "checkbox") {
                    localStorage.setItem(f, element.checked);
                } else {
                    localStorage.setItem(f, element.value);
                }
            });
            alert("Settings saved successfully!");
        });
    </script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const role = localStorage.getItem("role"); // "admin" or "tenant"

        // Sidebar menu items
        const reportsBtn = document.querySelector('a[href="reports.html"]');
        const notifBtn = document.querySelector('a[href="notifications.html"]');

        if (role === "tenant") {
            // Hide only Reports and Notifications in sidebar
            if (reportsBtn) reportsBtn.style.display = "none";
            if (notifBtn) notifBtn.style.display = "none";

            // Hide content sections not allowed for tenant
            const paymentSettings     = document.getElementById("payment-settings");
            const tenantManagement    = document.getElementById("tenant-management");
            const securitySettings    = document.getElementById("security-settings");

            if (paymentSettings)      paymentSettings.style.display      = "none";
            if (tenantManagement)     tenantManagement.style.display     = "none";
            if (securitySettings)     securitySettings.style.display     = "none";

        }

        // ── Role-based sidebar label for pay-rent nav ─────────────────────
        const payRentNav = document.querySelector('a[href="pay-rent.html"]');
        if (payRentNav && role === "tenant") {
            payRentNav.innerHTML = '<i class="fas fa-money-bill-wave"></i> Pay Rent';
        }
    });
    </script>

    <script>
document.addEventListener("DOMContentLoaded", () => {
    const role = localStorage.getItem("role") || "tenant";
    if (role === "admin") {
        const payRentLink = document.querySelector('a[href="pay-rent.html"]');
        if (payRentLink) {
            // Keep the icon, just change the text
            const icon = payRentLink.querySelector("i");
            payRentLink.textContent = "Tenant Payments";
            if (icon) {
                payRentLink.prepend(icon); // Re-add the icon
            }
        }
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const role = localStorage.getItem("role") || "tenant";
    const adminBtn = document.querySelector(".admin-btn");

    if (adminBtn) {
        if (role === "tenant") {
            adminBtn.textContent = "Profile";
            adminBtn.href = "profile.html"; 
        } else {
            adminBtn.textContent = "Admin";
            adminBtn.href = "profile.html"; 
        }
    }
});
</script>

    <script src="assets/js/sidebar-active.js"></script>
</body>
</html>
