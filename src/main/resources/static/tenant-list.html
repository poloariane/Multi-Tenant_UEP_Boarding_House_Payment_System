<script>
window.addEventListener('DOMContentLoaded', () => {

// MAX capacity per room
    const maxSlots = {
        room1: 4, room2: 4, room3: 4, room4: 4,
        room5: 4, room6: 8, room7: 8, room8: 4,
        room9: 4, room10: 10
    };

    // Rent per room
    const rentValues = {
        room1: 1500, room2: 1200, room3: 1200, room4: 1500,
        room5: 1200, room6: 1200, room7: 1200, room8: 1500,
        room9: 1200, room10: 1200
    };

    const bhInfo = JSON.parse(localStorage.getItem("bhInfo") || "{}");
    const bhKey = bhInfo.key;
    const tenants = bhKey ? JSON.parse(localStorage.getItem(bhKey) || "{}") : {};
    const payments = bhKey ? JSON.parse(localStorage.getItem(bhKey + "_payments") || "[]") : [];
    const role = localStorage.getItem("role") || "tenant";
    const activeTenant = JSON.parse(localStorage.getItem("activeTenant") || "null");
const hasSavedRoomSettings = bhKey && localStorage.getItem(bhKey + "_roomSettings") !== null;
    const roomSettings = bhKey && hasSavedRoomSettings ? JSON.parse(localStorage.getItem(bhKey + "_roomSettings") || "{}") : {};

    Object.keys(roomSettings).forEach(room => {
        if (!/^room\d+$/.test(room)) {
            delete roomSettings[room];
            return;
        }

        maxSlots[room] = Number(roomSettings[room].capacity) || maxSlots[room] || 4;
        rentValues[room] = Number(roomSettings[room].rent) || rentValues[room] || 1200;
    });

    Object.keys(tenants).forEach(room => {
        if (!/^room\d+$/.test(room)) {
            delete tenants[room];
            return;
        }

        if (!maxSlots[room]) {
            maxSlots[room] = Math.max(4, tenants[room].length);
            rentValues[room] = 1200;
            roomSettings[room] = { capacity: maxSlots[room], rent: rentValues[room] };
        }
    });

    const container = document.getElementById("rooms-container");
    const detailPanel = document.getElementById("room-detail");
    const addRoomBtn = document.getElementById("addRoomBtn");
    const removeRoomBtn = document.getElementById("removeRoomBtn");

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char]));
    }

    function normalizeRoomKey(value) {
        const roomNumber = String(value || "").trim().toLowerCase().replace("room", "").replace(/\s+/g, "");
        return roomNumber && /^\d+$/.test(roomNumber) ? `room${Number(roomNumber)}` : "";
    }

    function formatRoomName(room) {
        return room.replace("room", "Room ");
    }

    function getPaymentDate(payment) {
        if (payment.paymentMonth) {
            const monthDate = new Date(`${payment.paymentMonth}-01T00:00:00`);
            return Number.isNaN(monthDate.getTime()) ? null : monthDate;
        }

        const parsed = new Date(payment.date || payment.dateString || 0);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function getTenantPayments(tenant, room) {
        const tenantName = String(typeof tenant === "object" ? tenant.name : tenant).trim().toLowerCase();
        return payments.filter(payment => {
            const paymentName = String(payment.name || "").trim().toLowerCase();
            const paymentRoom = normalizeRoomKey(payment.room);
            return paymentName === tenantName && paymentRoom === room;
        });
    }

    function getPaidMonths(tenantPayments) {
        return tenantPayments
            .map(getPaymentDate)
            .filter(Boolean)
            .sort((a, b) => b - a)
            .map(date => date.toLocaleDateString("en-US", { month: "long", year: "numeric" }));
    }

    function getMonthLabel(date) {
        return date.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    }

    function getPaymentMonthsText(paidMonths) {
        const currentMonth = getMonthLabel(new Date());
        const uniquePaidMonths = [...new Set(paidMonths)];
        const hasCurrentMonthPayment = uniquePaidMonths.includes(currentMonth);

        if (!uniquePaidMonths.length) {
            return `Unpaid: ${currentMonth}`;
        }

        if (!hasCurrentMonthPayment) {
            return `Paid: ${uniquePaidMonths.map(escapeHTML).join(", ")}<br>Unpaid: ${escapeHTML(currentMonth)}`;
        }

        return `Paid: ${uniquePaidMonths.map(escapeHTML).join(", ")}`;
    }

    function getPaymentStatus(tenantPayments) {
        const now = new Date();
        const thisMonthPayments = tenantPayments.filter(payment => {
            const date = getPaymentDate(payment);
            return date && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
        });

        if (thisMonthPayments.length === 0) {
            return { label: "Not Paid", className: "unpaid", amount: "" };
        }

        const latestPayment = thisMonthPayments[thisMonthPayments.length - 1];
        const type = latestPayment.payType === "partial" ? "Partial" : "Paid";
        return {
            label: type,
            className: latestPayment.payType === "partial" ? "partial" : "paid",
            amount: latestPayment.amount ? ` - ₱${Number(latestPayment.amount).toLocaleString()}` : ""
        };
    }

    function openRoomDetail(room) {
        if (role === "tenant" && normalizeRoomKey(activeTenant?.room) !== room) {
            alert("You can only view your assigned room.");
            return;
        }

        const roomTenants = tenants[room] || [];
        const total = maxSlots[room] || roomTenants.length;
        const available = Math.max(0, total - roomTenants.length);
        const tenantRows = roomTenants.length
            ? roomTenants.map(tenant => {
                const name = typeof tenant === "object" ? tenant.name : tenant;
                const tenantPaymentList = getTenantPayments(tenant, room);
                const status = getPaymentStatus(tenantPaymentList);
                const paidMonths = [...new Set(getPaidMonths(tenantPaymentList))];

                return `
                    <tr>
                        <td>${escapeHTML(name)}</td>
                        <td><span class="payment-status ${status.className}">${status.label}${status.amount}</span></td>
                        <td>${getPaymentMonthsText(paidMonths)}</td>
                    </tr>
                `;
            }).join("")
            : `<tr><td colspan="3" class="room-detail-empty">No tenants assigned to this room.</td></tr>`;

        detailPanel.innerHTML = `
            <div class="room-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="roomDetailTitle">
            <div class="room-detail-header">
                <div>
                    <h3 id="roomDetailTitle">${formatRoomName(room)}</h3>
                    <p>Capacity: ${total} | Available: ${available} | ₱${Number(rentValues[room] || 0).toLocaleString()}</p>
                </div>
                <button type="button" class="room-detail-close" id="closeRoomDetail" aria-label="Close room details">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="room-detail-table-wrap">
                <table class="room-detail-table">
                    <thead>
                        <tr>
                            <th>Tenant</th>
                            <th>This Month</th>
                            <th>Months Paid</th>
                        </tr>
                    </thead>
                    <tbody>${tenantRows}</tbody>
                </table>
            </div>
            </div>
        `;

        detailPanel.classList.remove("hidden");
        detailPanel.setAttribute("aria-hidden", "false");
        document.getElementById("closeRoomDetail")?.addEventListener("click", () => {
            detailPanel.classList.add("hidden");
            detailPanel.setAttribute("aria-hidden", "true");
        });
        detailPanel.addEventListener("click", event => {
            if (event.target === detailPanel) {
                detailPanel.classList.add("hidden");
                detailPanel.setAttribute("aria-hidden", "true");
            }
        });
    }

    function saveRoomSettings() {
        const settings = {};
        Object.keys(maxSlots).forEach(room => {
            settings[room] = {
                capacity: maxSlots[room],
                rent: rentValues[room] || 1200
            };
        });
        if (bhKey) {
            localStorage.setItem(bhKey + "_roomSettings", JSON.stringify(settings));
        }
    }

    addRoomBtn?.addEventListener("click", () => {
        const room = normalizeRoomKey(prompt("Enter room number to add (example: 11):"));

        if (!room) {
            alert("Please enter a valid room number.");
            return;
        }

        if (maxSlots[room]) {
            alert("That room already exists.");
            return;
        }

        const capacity = Number(prompt("Enter room capacity:", "4"));
        if (!Number.isInteger(capacity) || capacity <= 0) {
            alert("Please enter a valid room capacity.");
            return;
        }

        const rent = Number(prompt("Enter monthly rent:", "1200"));
        if (!Number.isFinite(rent) || rent <= 0) {
            alert("Please enter a valid monthly rent.");
            return;
        }

        maxSlots[room] = capacity;
        rentValues[room] = rent;
        tenants[room] = tenants[room] || [];
        saveRoomSettings();
        if (bhKey) {
            localStorage.setItem(bhKey, JSON.stringify(tenants));
        }
        window.location.reload();
    });

    removeRoomBtn?.addEventListener("click", () => {
        const room = normalizeRoomKey(prompt("Enter room number to remove (example: 11):"));

        if (!room) {
            alert("Please enter a valid room number.");
            return;
        }

        if (!maxSlots[room]) {
            alert("Room not found.");
            return;
        }

        const occupied = tenants[room] && tenants[room].length > 0;
        const message = occupied
            ? `${room.replace("room", "Room ")} has tenants. Removing it will also remove those tenant assignments. Continue?`
            : `Remove ${room.replace("room", "Room ")}?`;

        if (!confirm(message)) return;

        delete maxSlots[room];
        delete rentValues[room];
        delete roomSettings[room];
        delete tenants[room];
        saveRoomSettings();
        if (bhKey) {
            localStorage.setItem(bhKey, JSON.stringify(tenants));
        }
        window.location.reload();
    });

    // GENERATE ROOM CARDS
    let visibleRooms = Object.keys(maxSlots);
    const tenantRoom = normalizeRoomKey(activeTenant?.room);

    visibleRooms.sort((a, b) => Number(a.replace("room", "")) - Number(b.replace("room", ""))).forEach(room => {

        const total = maxSlots[room];
        const used = tenants[room] ? tenants[room].length : 0;
        const available = total - used;

        const roomCard = document.createElement("div");
        roomCard.classList.add("room-card");
        const canOpenRoom = role === "admin" || room === tenantRoom;

        if (canOpenRoom) {
            roomCard.classList.add("clickable-room");
            roomCard.tabIndex = 0;
            roomCard.setAttribute("role", "button");
            roomCard.setAttribute("aria-label", `View ${formatRoomName(room)} tenants and payments`);
        } else {
            roomCard.classList.add("locked-room");
            roomCard.setAttribute("aria-label", `${formatRoomName(room)} is view only`);
        }

        roomCard.innerHTML = `
            <div class="room-title">${formatRoomName(room)}</div>

            <div class="room-info-box">
                Capacity: ${total} | Available: ${available} &nbsp; 
                ₱${rentValues[room].toLocaleString()}
            </div>

            <div class="tenant-grid"></div>
        `;

        const grid = roomCard.querySelector(".tenant-grid");
        if (!tenants[room]) tenants[room] = [];

        // Add tenants
        tenants[room].forEach(t => {
            const name = typeof t === "object" ? t.name : t;
            const slot = document.createElement("div");
            slot.classList.add("tenant-slot");
            slot.innerHTML = `<span class="status-dot"></span>${name}`;
            grid.appendChild(slot);
        });

        // Add vacant slots
        for (let i = 0; i < available; i++) {
            const slot = document.createElement("div");
            slot.classList.add("tenant-slot", "vacant");
            slot.innerHTML = `<span class="status-dot"></span>Vacant`;
            grid.appendChild(slot);
        }

        if (canOpenRoom) {
            roomCard.addEventListener("click", () => openRoomDetail(room));
            roomCard.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openRoomDetail(room);
                }
            });
        }

        container.appendChild(roomCard);
    });

});
</script>
