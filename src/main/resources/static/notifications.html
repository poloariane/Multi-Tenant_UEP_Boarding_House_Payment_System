<script>
document.addEventListener("DOMContentLoaded", () => {
    const ham = document.getElementById("hamburger");
    const side = document.getElementById("sidebar");
    if (ham && side) {
        ham.addEventListener("click", () => {
            side.classList.toggle("hidden");
        });
    }
});
</script>
<script>
/* ── Helpers ─────────────────────────────────────────────────────────── */

function getPaymentDate(p) {
    if (p.paymentMonth) {
        const d = new Date(`${p.paymentMonth}-01T00:00:00`);
        return isNaN(d.getTime()) ? null : d;
    }
    const parsed = new Date(p.date || p.dateString || 0);
    return isNaN(parsed.getTime()) ? null : parsed;
}

/** Returns the normalized room key from a payment, e.g. "room3" */
function paymentRoomKey(p) {
    const r = (p.room || "").toString().trim().toLowerCase().replace("room", "").replace(/\s+/g, "");
    return r ? "room" + r : "";
}

/** Rent for a given room from localStorage roomSettings, falling back to hardcoded defaults */
function getRentForRoom(roomKey) {
    const saved = JSON.parse(localStorage.getItem("roomSettings") || "{}");
    if (saved[roomKey] && saved[roomKey].rent) return Number(saved[roomKey].rent);
    const defaults = { room1:1500, room2:1200, room3:1200, room4:1500, room5:1200, room6:1200, room7:1200, room8:1500, room9:1200, room10:1200 };
    return defaults[roomKey] || 1200;
}

function timeAgo(dateVal) {
    const d = new Date(dateVal);
    if (isNaN(d)) return "Just now";
    const diffMs = Date.now() - d.getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "Just now";
    if (mins < 60) return `${mins} min${mins > 1 ? "s" : ""} ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} hour${hrs > 1 ? "s" : ""} ago`;
    const days = Math.floor(hrs / 24);
    return `${days} day${days > 1 ? "s" : ""} ago`;
}

/* ── Generate notifications ──────────────────────────────────────────── */

function generateNotifications() {
        const bhInfo = JSON.parse(localStorage.getItem("bhInfo") || "{}");
        const bhKey = bhInfo.key;
        const tenants   = bhKey ? JSON.parse(localStorage.getItem(bhKey) || "{}") : {};
        const payments  = bhKey ? JSON.parse(localStorage.getItem(bhKey + "_payments") || "[]") : [];
        const role      = localStorage.getItem("role") || "tenant";
        const activeTnt = JSON.parse(localStorage.getItem("activeTenant") || "null");

    const now           = new Date();
    const curMonthIdx   = now.getMonth();
    const curYear       = now.getFullYear();
    const curMonthLabel = now.toLocaleDateString("en-US", { month: "long", year: "numeric" });

    // Due-date threshold: 3 days from now (configurable)
    const dueThreshold = new Date(curYear, curMonthIdx, 15); // 15th of current month
    const isDueSoon    = now <= dueThreshold && now.getDate() >= 1;

    // Collect all tenant names (admin: all; tenant: self only)
    const allTenantNames = [];
    if (role === "admin") {
        Object.keys(tenants)
            .sort((a, b) => Number(a.replace("room","")) - Number(b.replace("room","")))
            .forEach(room => {
                (tenants[room] || []).forEach(t => {
                    allTenantNames.push(typeof t === "object" ? t.name : t);
                });
            });
    } else if (activeTnt?.name) {
        allTenantNames.push(activeTnt.name.trim());
    }

    const notifications = [];

    allTenantNames.forEach(name => {
        const norm   = name.trim().toLowerCase();
        const tPays  = payments.filter(p => p.name && p.name.trim().toLowerCase() === norm);

        const hasAnyPayment   = tPays.length > 0;
        const paidThisMonth   = tPays.some(p => {
            const d = getPaymentDate(p);
            return d && d.getMonth() === curMonthIdx && d.getFullYear() === curYear;
        });

        // ── 1 · Recent payment card  ─────────────────────────────────────
        // Always show the most-recent payment for tenants who have any
        // history — regardless of whether it falls in the current month or
        // a past one.  Only overdue/pending checks below decide the second card.
        if (hasAnyPayment) {
            const lastPay = tPays
                .filter(p => getPaymentDate(p))
                .sort((a, b) => (getPaymentDate(b) || 0) - (getPaymentDate(a) || 0))[0];

            const lastPayDate = getPaymentDate(lastPay);
            const payMonthLabel = lastPayDate
                ? lastPayDate.toLocaleDateString("en-US", { month: "long", year: "numeric" })
                : (lastPay.paymentMonth || "an earlier month");

            notifications.push({
                type:      "success",
                icon:      "fa-check-circle",
                msg:       `${name} recently paid ₱${lastPay.amount} for ${payMonthLabel}.`,
                timestamp: Date.now(),
                tag:       "payment",
                read:      false
            });
        }

        // ── 2 · Monetary status for CURRENT month  ──────────────────────
        if (paidThisMonth) {
            // ── Pending balance (partial payment this month) ────────────
            const roomKey  = tPays.length ? paymentRoomKey(tPays[0]) : "";
            const rent     = getRentForRoom(roomKey);
            const thisMonthPays = tPays.filter(p => {
                const d = getPaymentDate(p);
                return d && d.getMonth() === curMonthIdx && d.getFullYear() === curYear;
            });
            const paidThisMonthAmt = thisMonthPays.reduce((s, p) => s + (Number(p.amount) || 0), 0);
            const pendingBalance   = rent - paidThisMonthAmt;

            if (pendingBalance > 0) {
                notifications.push({
                    type:      "warning",
                    icon:      "fa-exclamation-circle",
                    msg:       `${name} has a pending balance of ₱${pendingBalance.toLocaleString()} for ${curMonthLabel}.`,
                    timestamp: Date.now(),
                    tag:       "payment",
                    read:      false
                });
            }
            // else: fully paid for the current month — no extra card needed
        } else if (hasAnyPayment) {
        // ── Overdue (no payment this month, but has history) ────────────
            notifications.push({
                type:      "danger",
                icon:      "fa-times-circle",
                msg:       `${name}'s payment is overdue for ${curMonthLabel}.`,
                timestamp: Date.now(),
                tag:       "overdue",
                read:      false
            });
        } else {
        // ── New tenant, no history yet ─────────────────────────────────
            notifications.push({
                type:      "info",
                icon:      "fa-user-plus",
                msg:       `${name} has not made any payment yet.`,
                timestamp: Date.now(),
                tag:       "payment",
                read:      false
            });
        }
    });

    // ── Due-date reminder ──────────────────────────────────────────────
    if (isDueSoon && role === "admin") {
        notifications.push({
            type:      "gray",
            icon:      "fa-clock",
            msg:       `Rent due date (${dueThreshold.toLocaleDateString("en-US", { month: "long", day: "numeric" })}th) is approaching. Please remind tenants to settle their payments.`,
            timestamp: Date.now(),
            tag:       "due",
            read:      false
        });
    }

    // Sort: payment → due → overdue → info
    const order = { success: 0, warning: 1, danger: 2, info: 3, gray: 4 };
    notifications.sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9));

    return notifications;
}

/* ── Render ─────────────────────────────────────────────────────────── */

function renderNotifications() {
    const container  = document.getElementById("notif-container");
    if (!container) return;

    const list = generateNotifications();

    if (list.length === 0) {
        container.innerHTML = `<div class="notif-empty"><i class="fas fa-bell-slash"></i><p>All caught up — no notifications.</p></div>`;
        return;
    }

    container.innerHTML = list.map(n => {
        const badgeClass = n.tag === "overdue" ? "notif-badge overdue" : n.tag === "due" ? "notif-badge due" : "";
        const badgeLabel = n.tag === "overdue" ? "OVERDUE" : n.tag === "due" ? "DUE SOON" : "";

        const timeStr = timeAgo(n.timestamp);
        const unreadClass = !n.read ? "unread" : "";

        return `<div class="card ${n.type} ${unreadClass}" data-tag="${n.tag}" data-msg="${n.msg.replace(/"/g, "&quot;")}">
            <div class="notif-header">
                <i class="fas ${n.icon}"></i>
                <span class="notif-body">${n.msg}${badgeLabel ? `<span class="${badgeClass}">${badgeLabel}</span>` : ""}</span>
            </div>
            <span class="notif-time"><i class="far fa-clock"></i> ${timeStr}</span>
            <div class="card-actions">
                <button class="read">Mark as Read</button>
                <button class="delete">Delete</button>
            </div>
        </div>`;
    }).join("");

    // Re-attach button listeners after DOM update
    document.querySelectorAll("#notif-container .read").forEach(btn => {
        btn.addEventListener("click", function () {
            const card = this.closest(".card");
            card.classList.add("read");
            this.remove();
            // If no actions remain, add subtle read styling
            if (!card.querySelector(".delete")) {
                card.style.opacity = "0.5";
            }
        });
    });

    document.querySelectorAll("#notif-container .delete").forEach(btn => {
        btn.addEventListener("click", function () {
            if (confirm("Are you sure you want to delete this notification?")) {
                this.closest(".card").remove();
            }
        });
    });
}

/* ── Search ─────────────────────────────────────────────────────────── */

document.getElementById("searchInput")?.addEventListener("keyup", function () {
    const filter = this.value.toLowerCase().trim();
    document.querySelectorAll(".card").forEach(card => {
        card.style.display = (card.dataset.msg || " ").toLowerCase().includes(filter) ? "flex" : "none";
    });
});

/* ── Filter ─────────────────────────────────────────────────────────── */

function filterNotifications(type) {
    document.querySelectorAll("#notif-container .card").forEach(card => {
        if (type === "all") { card.style.display = "flex"; return; }
        if (type === "unread") { card.style.display = card.classList.contains("unread") ? "flex" : "none"; return; }
        const tag = card.getAttribute("data-tag") || "";
        card.style.display = tag === type ? "flex" : "none";
    });
    setActiveFilter(type);
}

/* ── Filter active state ─────────────────────────────────────────────── */

function setActiveFilter(type) {
    document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === type);
    });
}
document.querySelectorAll(".filters button").forEach(btn => {
    btn.dataset.filter = btn.getAttribute("onclick").match(/'([^']+)'/)[1];
});

/* ── Render on load ─────────────────────────────────────────────────── */

document.addEventListener("DOMContentLoaded", () => {
    renderNotifications();
    setActiveFilter("all");
});

      /* ── Live updates when another tab writes to localStorage ───────────── */
  
  window.addEventListener("storage", e => {
      if (e.key === "tenantPayments" || e.key === "tenants" || e.key === "activeTenant") {
          renderNotifications();
      }
   });

</script>
<script src="assets/js/sidebar-active.js"></script>
