<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/auth-guard.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UEP Boarding House — Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="topbar">
    <i id="hamburger" class="fas fa-bars"></i>
    <a href="about.html" class="title-link">
        <div class="title">
            <img src="assets/photos/logo.png">
            Multi-Tenant Boarding House Payment System
        </div>
    </a>
    <div class="topbar-buttons">
        <a href="dashboard.html" class="admin-btn">Back</a>
    </div>
</div>

<div class="layout">
    <div class="nav" id="sidebar">
        <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="tenant-list.html"><i class="fas fa-user-friends"></i> Tenants</a>
        <a href="pay-rent.html"><i class="fas fa-money-bill-wave"></i> Pay Rent</a>
        <a href="payment-records.html"><i class="fas fa-receipt"></i> Payment Records</a>
        <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a>
        <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        <a href="calendar.html"><i class="fas fa-calendar"></i> Calendar</a>
    </div>

    <main class="main">
      <div class="section-title"><i class="fas fa-user"></i> My Profile</div>
      
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        
        <div style="text-align: center; padding: 24px; border-bottom: 1px solid #e5e7eb;">
          <div class="avatar" aria-hidden="true" style="width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white;"></div>
          <input id="profilePicInput" type="file" accept="image/*" hidden>
          <button id="changePicBtn" class="primary-btn" style="margin-bottom: 16px;">
            <i class="fas fa-camera"></i> Change Picture
          </button>
        </div>

        <div style="padding: 24px;">
          <div style="text-align: center; margin-bottom: 24px;">
            <h2 id="tenantName" style="font-size: 24px; font-weight: bold; margin: 0 0 8px 0;">Tenant Name</h2>
            <p id="tenantRole" style="font-size: 14px; color: #6b7280; margin: 0;">Tenant</p>
          </div>

          <div style="margin-bottom: 24px;">
            <h3 style="font-size: 16px; font-weight: bold; margin: 0 0 16px 0; color: #1f2937;">
              <i class="fas fa-id-card"></i> Personal Information
            </h3>
            <div style="display: grid; gap: 16px;">
              <div style="display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center;">
                <span style="font-weight: 600; color: #6b7280;"><i class="fas fa-envelope"></i> Email</span>
                <div id="tenantEmail" style="color: #1f2937;">tenant@example.com</div>
              </div>
              <div style="display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center;">
                <span style="font-weight: 600; color: #6b7280;"><i class="fas fa-phone"></i> Contact</span>
                <div id="tenantContact" style="color: #1f2937;">09123456789</div>
              </div>
              <div style="display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center;">
                <span style="font-weight: 600; color: #6b7280;"><i class="fas fa-bed"></i> Room</span>
                <div id="tenantRoom" style="color: #1f2937;">Room</div>
              </div>
              <div style="display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center;">
                <span style="font-weight: 600; color: #6b7280;"><i class="fas fa-calendar-alt"></i> Start Date</span>
                <div id="tenantStartDate" style="color: #1f2937;">—</div>
              </div>
            </div>
          </div>

          <div style="display: flex; gap: 12px; justify-content: flex-end; padding: 0 24px 24px;">
            <button id="editBtn" class="secondary-btn" style="display: none;"><i class="fas fa-edit"></i> Edit Profile</button>
            <button id="addStaffBtn" class="secondary-btn" style="display: none;"><i class="fas fa-user-plus"></i> Add Staff</button>
          </div>
        </div>
      </div>
    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const role = localStorage.getItem("role");
    
    if (!role) {
        window.location.href = "login.html";
        return;
    }

    let user = role === "admin" ? JSON.parse(localStorage.getItem("activeAdmin")) : JSON.parse(localStorage.getItem("activeTenant"));
    
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("tenantName").textContent = user.name || "Admin";
    document.getElementById("tenantRole").textContent = role === "admin" ? "Administrator" : "Tenant";
    document.getElementById("tenantEmail").textContent = user.email || "N/A";
    document.getElementById("tenantContact").textContent = user.contact || "N/A";
    document.getElementById("tenantRoom").textContent = role === "admin" ? "N/A" : (user.room || "Room");
    document.getElementById("tenantStartDate").textContent = role === "admin" ? "N/A" : (user.startDate ? new Date(user.startDate).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "—");

    const avatarEl = document.querySelector(".avatar");
    if (user?.profilePic) {
        avatarEl.style.backgroundImage = `url(${user.profilePic})`;
        avatarEl.style.backgroundSize = "cover";
        avatarEl.style.backgroundPosition = "center";
        avatarEl.textContent = "";
    }

    const editBtn = document.getElementById("editBtn");
    const addStaffBtn = document.getElementById("addStaffBtn");

    if (role === "admin" && addStaffBtn) {
        addStaffBtn.style.display = "inline-flex";
        addStaffBtn.addEventListener("click", () => {
            const name = prompt("Enter staff name:");
            if (name === null) return;
            const email = prompt("Enter staff email:");
            if (email === null) return;
            const contact = prompt("Enter staff contact number:");
            if (contact === null) return;
            const password = prompt("Enter staff password:");
            if (password === null) return;

            if (!name || !email || !contact || !password) {
                alert("All fields are required!");
                return;
            }

            const admins = JSON.parse(localStorage.getItem("admins")) || [];
            admins.push({ name, email, contact, password, role: "admin" });
            localStorage.setItem("admins", JSON.stringify(admins));
            alert(`Admin "${name}" added successfully!`);
        });
    }

    if (role === "tenant" && editBtn) {
        editBtn.style.display = "inline-flex";
    }

    const nameEl = document.getElementById("tenantName");
    const emailEl = document.getElementById("tenantEmail");
    const contactEl = document.getElementById("tenantContact");
    const tenantRoomEl = document.getElementById("tenantRoom");
    const tenantStartDateEl = document.getElementById("tenantStartDate");
    const profilePicInput = document.getElementById("profilePicInput");
    let originalEmail = user?.email || "";

    const renderAvatar = () => {
        if (user?.profilePic) {
            avatarEl.style.backgroundImage = `url(${user.profilePic})`;
            avatarEl.style.backgroundSize = "cover";
            avatarEl.style.backgroundPosition = "center";
            avatarEl.textContent = "";
        } else {
            avatarEl.style.backgroundImage = "";
            avatarEl.style.background = "#222";
            avatarEl.style.color = "white";
            avatarEl.textContent = "Upload";
        }
    };

    const persistUser = () => {
        if (role === "admin") {
            localStorage.setItem("activeAdmin", JSON.stringify(user));
            let admins = JSON.parse(localStorage.getItem("admins")) || [];
            const index = admins.findIndex(a => a.email === originalEmail);
            if (index !== -1) {
                admins[index] = user;
                localStorage.setItem("admins", JSON.stringify(admins));
            }
} else {
             localStorage.setItem("activeTenant", JSON.stringify(user));
             const bhInfo = JSON.parse(localStorage.getItem("bhInfo") || "{}");
             const bhKey = bhInfo.key;
             let tenants = bhKey ? JSON.parse(localStorage.getItem(bhKey)) || {} : {};
             for (let room in tenants) {
                 tenants[room] = tenants[room].map(t => {
                     if (t.email === originalEmail) {
                         return { ...t, ...user };
                     }
                     return t;
                 });
             }
             if (bhKey) {
                 localStorage.setItem(bhKey, JSON.stringify(tenants));
             }
         }
    };

    if (profilePicInput) {
        profilePicInput.addEventListener("change", e => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                user.profilePic = event.target.result;
                renderAvatar();
                persistUser();
            };
            reader.readAsDataURL(file);
        });
    }

    document.getElementById("changePicBtn")?.addEventListener("click", () => {
        profilePicInput?.click();
    });

    if (editBtn) {
        editBtn.addEventListener("click", () => {
            if (editBtn.textContent.includes("Edit")) {
                nameEl.innerHTML = `<input type="text" id="editName" value="${user.name || ''}" style="width: 90%;">`;
                emailEl.innerHTML = `<input type="email" id="editEmail" value="${user.email || ''}" style="width: 90%;">`;
                contactEl.innerHTML = `<input type="text" id="editContact" value="${user.contact || ''}" style="width: 90%;">`;
                editBtn.innerHTML = '<i class="fas fa-save"></i> Save Profile';
            } else {
                const newName = document.getElementById("editName").value.trim();
                const newEmail = document.getElementById("editEmail").value.trim();
                const newContact = document.getElementById("editContact").value.trim();

                if (!newName || !newEmail || !newContact) {
                    alert("All fields are required!");
                    return;
                }

                user.name = newName;
                user.email = newEmail;
                user.contact = newContact;

                persistUser();
                originalEmail = user.email;

                nameEl.textContent = user.name;
                emailEl.textContent = user.email;
                contactEl.textContent = user.contact;
                renderAvatar();
                editBtn.innerHTML = '<i class="fas fa-edit"></i> Edit Profile';
                alert("Profile updated successfully!");
            }
        });
    }

    // Sidebar menu buttons
    const reportsBtn = document.querySelector('a[href="reports.html"]');
    const notifBtn = document.querySelector('a[href="notifications.html"]');
    if (role === "tenant") {
        if (reportsBtn) reportsBtn.style.display = "none";
        if (notifBtn) notifBtn.style.display = "none";
    }

    // Admin rename Pay Rent to Tenant Payments
    if (role === "admin") {
        const payRentLink = document.querySelector('a[href="pay-rent.html"]');
        if (payRentLink) {
            const icon = payRentLink.querySelector("i");
            payRentLink.textContent = "Tenant Payments";
            if (icon) payRentLink.prepend(icon);
        }
    }

    const adminBtn = document.querySelector('.admin-btn');
    if (adminBtn) {
        adminBtn.textContent = role === "tenant" ? "Back" : "Back";
        adminBtn.href = 'dashboard.html';
    }
});

    const ham = document.getElementById("hamburger");
    const side = document.getElementById("sidebar");
    if (ham && side) {
        ham.addEventListener("click", () => side.classList.toggle("hidden"));
    }
</script>

<script src="assets/js/sidebar-active.js"></script>
</body>
</html>
