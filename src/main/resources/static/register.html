<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/auth-guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    <link rel="stylesheet" href="assets/css/styles.css"><title>UEP BH Payment System — Admin Add Tenant</title>

    
</head>
<body>

    <div class="register-box">
        <h2>Admin — (Add Tenant)</h2>

        <form id="registerForm">
            <input type="hidden" id="role" value="Tenant">

            <label>Full Name</label>
            <input type="text" required placeholder="Enter tenant name">

            <label>Email</label>
            <input type="email" required placeholder="Enter tenant email">

            <label>Contact Number</label>
            <input type="text" required placeholder="Enter tenant contact number">

            <label>Password</label>
            <input type="password" required placeholder="Create temporary password">

            <button type="submit" class="register-btn">Add Tenant</button>
        </form>

        <div class="back-link">
            <a href="dashboard.html">Back to Dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();

            alert("Tenant Added Successfully!");
            window.location.href = "dashboard.html";
        });
    </script>

  <script src="assets/js/sidebar-active.js"></script>

</body>
</html>
