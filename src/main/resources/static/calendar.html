            </div>
            <div class="calendar-legend">
    <div><span class="legend-box due"></span> Red = Rent Due Week</div>
    <div><span class="legend-box today"></span> Blue = Today</div>
</div>

        </div>
    </div>
</div>

<script>
let currentDate = new Date();

function renderCalendar() {
    const month = currentDate.getMonth();
    const year = currentDate.getFullYear();

    document.getElementById("monthYear").textContent =
        currentDate.toLocaleString("default", { month: "long" }) + " " + year;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const calendarGrid = document.getElementById("calendarGrid");

    // Remove old day boxes
    const oldBoxes = calendarGrid.querySelectorAll(".day-box");
    oldBoxes.forEach(box => box.remove());

    // Add blank boxes for offset
    for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement("div");
        blank.classList.add("day-box", "empty-box");
        calendarGrid.appendChild(blank);
    }

    // Today's date
    const today = new Date();
    const isSameMonth = today.getMonth() === month && today.getFullYear() === year;

    // Get tenant's due date for highlighting
    const role = localStorage.getItem("role");
    const activeTenant = role === "tenant" ? JSON.parse(localStorage.getItem("activeTenant") || "null") : null;
    const tenantDueDate = activeTenant?.startDate ? new Date(activeTenant.startDate) : null;
    const dueDay = tenantDueDate ? tenantDueDate.getDate() : null;

    // Add days
    for (let day = 1; day <= daysInMonth; day++) {
        const box = document.createElement("div");
        box.classList.add("day-box");
        box.textContent = day;

        // Highlight due week for tenants based on their start date
        if (role === "tenant" && tenantDueDate) {
            const dueWeekNum = Math.ceil(dueDay / 7);
            const dayWeekNum = Math.ceil(day / 7);
            if (dueWeekNum === dayWeekNum) {
                box.classList.add("due");
                box.title = "Due Week";
            }
        }

        // Highlight current day
        if (isSameMonth && day === today.getDate()) {
            box.classList.add("today");
            box.title = "Today";
        }

        calendarGrid.appendChild(box);
    }
}

document.getElementById("prevMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
});

document.getElementById("nextMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
});

// Dynamic legend based on role
document.addEventListener("DOMContentLoaded", () => {
    const role = localStorage.getItem("role");
    const legend = document.querySelector(".calendar-legend");
    
    if (role === "admin" && legend) {
        const dueLegend = Array.from(legend.children).find(el => el.textContent.includes("Rent Due"));
        if (dueLegend) dueLegend.remove();
    }
    
    if (role === "tenant" && legend) {
        const tenant = JSON.parse(localStorage.getItem("activeTenant") || "null");
        if (tenant?.startDate) {
            const dueLegend = Array.from(legend.children).find(el => el.textContent.includes("Rent Due"));
            if (dueLegend) {
                const dueDate = new Date(tenant.startDate);
                const dueWeek = Math.ceil(dueDate.getDate() / 7);
                dueLegend.innerHTML = `<span class="legend-box due"></span> Red = Your Due Week (Week ${dueWeek})`;
            }
        }
    }
});

renderCalendar();

</script>
