        <div class="section-title"><i class="fas fa-user-minus"></i> Remove Tenant</div>

        <div class="form-box">

            <label>Select Room</label>
            <select id="roomSelect">
                <option value="" disabled selected>Select Room</option>
                <option value="room1">Room 1</option>
                <option value="room2">Room 2</option>
                <option value="room3">Room 3</option>
                <option value="room4">Room 4</option>
                <option value="room5">Room 5</option>
                <option value="room6">Room 6</option>
                <option value="room7">Room 7</option>
                <option value="room8">Room 8</option>
                <option value="room9">Room 9</option>
                <option value="room10">Room 10</option>
            </select>

            <label>Select Tenant</label>
            <select id="tenantSelect">
                <option value="" disabled selected>Select Tenant</option>
            </select>

            <button onclick="removeTenant()">Remove Tenant</button>
        </div>
    </div>
</div>

<script>
// Load tenants into dropdown
function loadTenants(room) {
    const tenantSelect = document.getElementById("tenantSelect");
    tenantSelect.innerHTML = '<option value="" disabled selected>Select Tenant</option>';

    const bhInfo = JSON.parse(localStorage.getItem("bhInfo") || "{}");
    const bhKey = bhInfo.key;
    const tenants = bhKey ? JSON.parse(localStorage.getItem(bhKey)) || {} : {};

    if (!tenants[room] || tenants[room].length === 0) {
        tenantSelect.innerHTML += '<option disabled>No tenants in this room</option>';
        return;
    }

    tenants[room].forEach(t => {
        const name = typeof t === "object" ? t.name : t;
        tenantSelect.innerHTML += `<option value="${name}">${name}</option>`;
    });
}

document.getElementById("roomSelect").addEventListener("change", () => {
    loadTenants(document.getElementById("roomSelect").value);
});

// Remove tenant from localStorage
function removeTenant() {
    const room = document.getElementById("roomSelect").value;
    const selectedName = document.getElementById("tenantSelect").value;

    if (!room || !selectedName) {
        alert("Please select a room and a tenant.");
        return;
    }

    const bhInfo = JSON.parse(localStorage.getItem("bhInfo") || "{}");
    const bhKey = bhInfo.key;
    let tenants = bhKey ? JSON.parse(localStorage.getItem(bhKey)) || {} : {};
    if (!tenants[room]) return;

    tenants[room] = tenants[room].filter(t => {
        const name = typeof t === "object" ? t.name : t;
        return name !== selectedName;
    });

    localStorage.setItem(bhKey, JSON.stringify(tenants));

    alert(`Tenant "${selectedName}" removed successfully.`);
    loadTenants(room);
}
</script>

<script>

            // Keep the icon, just change the text

            if (icon) {
                payRentLink.prepend(icon); // Re-add the icon
            }
        }
    }
});
</script>
