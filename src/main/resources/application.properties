# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/uep_bhps?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Application Configuration
spring.application.name=UEP BHPS
logging.level.com.uepbh=DEBUG
logging.level.org.springframework.web=DEBUG

# H2 Console (for development/testing only)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidation12345
jwt.expiration=86400000
