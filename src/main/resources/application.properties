# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration for Railway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Application Configuration
spring.application.name=UEP BHPS
logging.level.com.uepbh=DEBUG
logging.level.org.springframework.web=DEBUG

# H2 Console (for development/testing only)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidation12345
jwt.expiration=86400000